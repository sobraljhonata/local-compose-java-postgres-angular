events { worker_connections 1024; }
http {
  server {
    listen 80;
    location /autua-bff/ {
      proxy_pass http://host.docker.internal:18081/autua-bff/;
      proxy_http_version 1.1;
      proxy_set_header Host host.docker.internal:18081;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Strip Origin so Spring CORS does not reject browser on :4200/:14200
      proxy_set_header Origin "";
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Access-Control-Allow-Headers * always;
      add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
      if ($request_method = OPTIONS) { return 204; }
    }
    location /autua-api/ {
      proxy_pass http://host.docker.internal:18080/autua-api/;
      proxy_http_version 1.1;
      proxy_set_header Host host.docker.internal:18080;
      proxy_set_header Origin "";
      proxy_hide_header Access-Control-Allow-Origin;
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
      add_header Access-Control-Allow-Headers * always;
      if ($request_method = OPTIONS) { return 204; }
    }
    location / { return 404; }
  }
  server {
    listen 81;
    location / {
      proxy_pass http://host.docker.internal:14200/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
