# Banco DESCARTÁVEL de prova B.2 — NÃO é o Compose definitivo.
# Sem portas no host. Volume exclusivo. Dump montado somente leitura.
name: autua-pg-validate

networks:
  validate-net:
    name: autua-pg-validate-net
    internal: true

volumes:
  autua_pg_validate_data:
    name: autua_pg_validate_data

services:
  pg-validate:
    image: postgres:17-alpine
    container_name: autua-pg-validate
    restart: "no"
    environment:
      POSTGRES_USER: validate
      POSTGRES_PASSWORD: validate_temp_local_only
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - autua_pg_validate_data:/var/lib/postgresql/data
      - ../extract-temp/out/autua-api-min-sanitized-20261103-165903.dump:/dump/reduced.dump:ro
      - ./scripts:/scripts:ro
      - ./out:/out
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validate -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [validate-net]
