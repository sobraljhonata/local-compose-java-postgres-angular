# GD-48 — TLS terminator isolado para urlConsumo HTTPS no ensaio.
# Upstream: BFF ensaio :28081 (host). Não altera API/Auth/PG.
# Certificado: CA de desenvolvimento (não produção).

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log /var/log/nginx/access.log;
  client_max_body_size 2m;

  server {
    listen 8443 ssl;
    server_name 127.0.0.1 10.0.2.2 localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://host.docker.internal:28081;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Correlation-ID $http_correlation_id;
    }
  }
}
